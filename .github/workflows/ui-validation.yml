name: Validate UI package

on:
  workflow_call:
    inputs:
      source:
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: UI / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Prepare pinned official source
        run: bun run setup
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Check and test contracts
        run: bun run check && bun test ./test
      - name: Build official UI package
        run: bun run build:ui
      - name: Prepare matching test service
        run: bun scripts/ui-test-cli.ts
      - name: Install Chromium
        if: runner.os == 'Linux'
        run: bunx playwright install --with-deps chromium
      - name: Verify actual attachment sends
        run: bun run test:attachments
      - name: Verify update, draft and rollback
        run: bun run test:ui-update
      - name: Verify transcript, permissions and forms
        run: bun scripts/session-smoke.ts
      - name: Bundle publisher for this validated source
        run: |
          bun build scripts/ui-publish.ts --target=bun --outfile=artifacts/ui/publish.cjs
          bun build scripts/ui-upstream.ts --target=bun --outfile=artifacts/ui/upstream.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: ui-${{ runner.os }}
          path: artifacts/ui/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-failure-${{ runner.os }}
          path: |
            artifacts/attachment-test-*/ui-update-failure.png
            artifacts/attachment-test-*/failure.png
            artifacts/session-*/**/*.png
