name: CI

on:
  push:
    branches: [dev]
    tags: ["v*"]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Prepare pinned official UI
        run: bun run setup
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Lint and typecheck
        run: bun run check
      - name: Test adapter contracts
        run: bun test test
      - name: Build VSIX
        run: bun run package
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-sidebar-${{ matrix.os }}
          path: "*.vsix"
          if-no-files-found: error
